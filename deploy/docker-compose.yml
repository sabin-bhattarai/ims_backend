# Local development stack: API + worker + Postgres + Redis + a mail catcher.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml run --rm api /app/seed
#
# API:     http://localhost:8080
# Docs:    http://localhost:8080/docs/index.html
# Mailpit: http://localhost:8025
# Asynq:   http://localhost:8081 (queue dashboard)

name: ims

services:
  postgres:
    # 16 for `UNIQUE NULLS NOT DISTINCT`, which the stock_items natural key needs.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ims
      POSTGRES_DB: ims
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every outbound email locally so password-reset flows are testable
    # without a real SMTP account.
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      PORT: 8080
      LOG_LEVEL: debug
      DATABASE_URL: postgres://ims:ims@postgres:5432/ims?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTO_MIGRATE: "true"
      JWT_SECRET: local-development-secret-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_APP_BASE_URL: http://localhost:5173
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Same image, different entrypoint: the worker scales independently of the
    # API so a report backlog never slows down barcode scans.
    entrypoint: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://ims:ims@postgres:5432/ims?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTO_MIGRATE: "false"
      JWT_SECRET: local-development-secret-at-least-32-chars
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      QUEUE_CONCURRENCY: 5

  asynqmon:
    # Queue dashboard: inspect pending, scheduled, retried and dead jobs.
    image: hibiken/asynqmon:latest
    command: ["--redis-addr=redis:6379"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  postgres-data:
  redis-data:
