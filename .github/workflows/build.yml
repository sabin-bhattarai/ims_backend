name: Build and publish image

# Publishes a container image on every merge into dev (staging candidate) and
# main (release candidate). Tags carry the branch and the short SHA so a running
# deployment can always be traced back to a commit.
on:
  push:
    branches: [dev, main]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify the team channel
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Optional: skip silently when no webhook is configured.
          [ -z "$WEBHOOK" ] && exit 0
          status="${{ job.status }}"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"ims-backend image build *${status}* for \`${{ github.ref_name }}\` (${{ github.sha }})\"}" \
            "$WEBHOOK" || true
