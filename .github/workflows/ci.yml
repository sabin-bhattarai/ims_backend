name: CI

# Runs on every pull request and on pushes to the long-lived branches.
# Branch protection on dev and main requires the `required` job to pass.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A new push to the same PR cancels the previous run: no point burning runners
# on a commit nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  contract:
    name: OpenAPI contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      # docs/openapi.yaml is the single source of truth that ims-web and
      # ims-mobile generate their clients from. If it drifts from the code, both
      # clients silently go stale — so a stale spec fails the build here.
      - name: Regenerate and diff
        run: |
          swag init --generalInfo cmd/api/main.go --dir ./ --output docs \
            --outputTypes go,json,yaml --parseDependency --parseInternal
          # swaggo emits Swagger 2.0; the published contract is OpenAPI 3.0.
          npx --yes swagger2openapi docs/swagger.yaml --yaml --outfile docs/openapi.yaml
          if ! git diff --exit-code -- docs/openapi.yaml docs/swagger.json; then
            echo "::error::The OpenAPI spec is out of date. Run 'make docs' and commit docs/."
            exit 1
          fi

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Unit tests
        run: go test -race -covermode=atomic -coverprofile=unit.out -coverpkg=./internal/... ./...

      # Integration tests bring up Postgres through testcontainers, which uses
      # the Docker daemon preinstalled on GitHub's ubuntu runners.
      - name: Integration tests
        run: go test -tags=integration -race -timeout=20m -covermode=atomic -coverprofile=integration.out -coverpkg=./internal/... ./internal/api/...

      - name: Enforce coverage gate on internal/
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge unit.out integration.out > coverage.out
          go tool cover -func=coverage.out | tail -20
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage of internal/: ${total}%"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t+0 < 70) { print "::error::coverage " t "% is below the 70% gate"; exit 1 } }'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build binaries and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: make build

      - name: Build container image
        run: docker build -f deploy/Dockerfile --build-arg VERSION=${{ github.sha }} -t ims-backend:ci .

      # Prove the image actually boots and serves before anything downstream
      # trusts it.
      - name: Smoke test the image
        run: |
          docker network create ims-ci
          docker run -d --name pg --network ims-ci \
            -e POSTGRES_USER=ims -e POSTGRES_PASSWORD=ims -e POSTGRES_DB=ims \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U ims -d ims && break
            sleep 2
          done
          docker run -d --name api --network ims-ci -p 8080:8080 \
            -e DATABASE_URL='postgres://ims:ims@pg:5432/ims?sslmode=disable' \
            -e JWT_SECRET='ci-secret-value-that-is-long-enough-here' \
            -e AUTO_MIGRATE=true \
            -e REDIS_URL='redis://127.0.0.1:1/0' \
            ims-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json; break
            fi
            sleep 2
          done
          # Readiness must report ok or degraded (Redis is absent here on purpose).
          grep -qE '"status":"(ok|degraded)"' /tmp/ready.json || {
            echo "::error::the image did not become ready"; docker logs api; exit 1; }

      - if: always()
        run: docker logs api || true

  required:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, contract, test, build]
    if: always()
    steps:
      # A single required status check for branch protection: adding a job above
      # does not mean editing the protection rule.
      - name: Verify every job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
