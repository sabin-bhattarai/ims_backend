version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type:chore", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the routine patch churn; majors still arrive individually so
      # they get read properly.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type:chore"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    labels: ["type:chore"]
    commit-message:
      prefix: "chore(docker)"
