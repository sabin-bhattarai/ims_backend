openapi: 3.0.0
info:
  contact: {}
  description: Inventory Management System REST API. Every response is wrapped in
    a `data` envelope; errors use an `error` envelope with a stable
    machine-readable code.
  title: IMS API
  version: 1.0.0
paths:
  /auth/change-password:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.ChangePasswordInput"
        description: Current and new password
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      security:
        - BearerAuth: []
      summary: Change password
      tags:
        - auth
  /auth/forgot-password:
    post:
      description: Always returns 202, whether or not the email is registered.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.forgotPasswordRequest"
        description: Email
        required: true
      responses:
        "202":
          description: Accepted
      summary: Request a password reset
      tags:
        - auth
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.LoginInput"
        description: Credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_auth.SessionResponse"
                    type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      summary: Log in
      tags:
        - auth
  /auth/logout:
    post:
      requestBody:
        $ref: "#/components/requestBodies/internal_auth.refreshRequest"
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
        - auth
  /auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Log out of every device
      tags:
        - auth
  /auth/me:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_auth.MeResponse"
                    type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      security:
        - BearerAuth: []
      summary: Current user
      tags:
        - auth
  /auth/refresh:
    post:
      requestBody:
        $ref: "#/components/requestBodies/internal_auth.refreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_auth.SessionResponse"
                    type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      summary: Refresh a session
      tags:
        - auth
  /auth/register:
    post:
      description: Creates an organization and its first admin user, returning a session.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.RegisterInput"
        description: Registration details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_auth.SessionResponse"
                    type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      summary: Register a new organization
      tags:
        - auth
  /auth/reset-password:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_auth.ResetPasswordInput"
        description: Reset token and new password
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      summary: Reset a password with a token
      tags:
        - auth
  /categories:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/internal_product.Category"
                        type: array
                    type: object
      security:
        - BearerAuth: []
      summary: List categories
      tags:
        - categories
    post:
      requestBody:
        $ref: "#/components/requestBodies/internal_product.CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Category"
                    type: object
      security:
        - BearerAuth: []
      summary: Create a category
      tags:
        - categories
  "/categories/{id}":
    delete:
      parameters:
        - description: Category id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Delete a category
      tags:
        - categories
    put:
      parameters:
        - description: Category id
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/internal_product.CategoryInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Category"
                    type: object
      security:
        - BearerAuth: []
      summary: Update a category
      tags:
        - categories
  /customers:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/internal_sales.Customer"
                        type: array
                      meta:
                        $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                          red.PageMeta"
                    type: object
      security:
        - BearerAuth: []
      summary: List customers
      tags:
        - customers
    post:
      requestBody:
        $ref: "#/components/requestBodies/internal_sales.CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_sales.Customer"
                    type: object
      security:
        - BearerAuth: []
      summary: Create a customer
      tags:
        - customers
  "/customers/{id}":
    get:
      parameters:
        - description: Customer id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_sales.Customer"
                    type: object
      security:
        - BearerAuth: []
      summary: Get a customer
      tags:
        - customers
    put:
      parameters:
        - description: Customer id
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/internal_sales.CustomerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_sales.Customer"
                    type: object
      security:
        - BearerAuth: []
      summary: Update a customer
      tags:
        - customers
  /health/live:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_platform.Health"
      summary: Liveness probe
      tags:
        - health
  /health/ready:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_platform.Health"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_platform.Health"
      summary: Readiness probe
      tags:
        - health
  /invoices:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/internal_sales.Invoice"
                        type: array
                      meta:
                        $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                          red.PageMeta"
                    type: object
      security:
        - BearerAuth: []
      summary: List invoices
      tags:
        - invoices
  "/invoices/{id}/payments":
    post:
      parameters:
        - description: Invoice id
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_sales.RecordPaymentInput"
        description: Payment
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_sales.Invoice"
                    type: object
      security:
        - BearerAuth: []
      summary: Record a payment against an invoice
      tags:
        - invoices
  /notifications:
    get:
      parameters:
        - description: Only unread
          in: query
          name: filter[unread]
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/internal_notification.Notification"
                        type: array
                      meta:
                        $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                          red.PageMeta"
                    type: object
      security:
        - BearerAuth: []
      summary: List notifications
      tags:
        - notifications
  "/notifications/{id}/read":
    post:
      parameters:
        - description: Notification id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Mark a notification read
      tags:
        - notifications
  /notifications/devices:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_notification.RegisterDeviceInput"
        description: Device token
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_notification.DeviceToken"
                    type: object
      security:
        - BearerAuth: []
      summary: Register a push device
      tags:
        - notifications
  "/notifications/devices/{token}":
    delete:
      parameters:
        - description: Device token
          in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Unregister a push device
      tags:
        - notifications
  /notifications/read-all:
    post:
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Mark all notifications read
      tags:
        - notifications
  /products:
    get:
      parameters:
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
        - description: Items per page
          in: query
          name: per_page
          schema:
            type: integer
        - description: Search name, SKU or barcode
          in: query
          name: q
          schema:
            type: string
        - description: Sort, e.g. -created_at
          in: query
          name: sort
          schema:
            type: string
        - description: Filter by category
          in: query
          name: filter[category_id]
          schema:
            type: string
        - description: Filter by active flag
          in: query
          name: filter[is_active]
          schema:
            type: boolean
        - description: Only products at or below their minimum
          in: query
          name: filter[below_min_stock]
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/internal_product.Product"
                        type: array
                      meta:
                        $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                          red.PageMeta"
                    type: object
      security:
        - BearerAuth: []
      summary: List products
      tags:
        - products
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_product.CreateProductInput"
        description: Product
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Product"
                    type: object
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      security:
        - BearerAuth: []
      summary: Create a product
      tags:
        - products
  "/products/{id}":
    delete:
      parameters:
        - description: Product id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      security:
        - BearerAuth: []
      summary: Delete a product
      tags:
        - products
    get:
      parameters:
        - description: Product id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Product"
                    type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      security:
        - BearerAuth: []
      summary: Get a product
      tags:
        - products
    patch:
      parameters:
        - description: Product id
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_product.UpdateProductInput"
        description: Fields to change
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Product"
                    type: object
      security:
        - BearerAuth: []
      summary: Update a product
      tags:
        - products
  "/products/{id}/images":
    post:
      parameters:
        - description: Product id
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_product.AddImageInput"
        description: Image
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Image"
                    type: object
      security:
        - BearerAuth: []
      summary: Add a product image
      tags:
        - products
  "/products/{id}/variants":
    post:
      parameters:
        - description: Product id
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_product.VariantInput"
        description: Variant
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.Variant"
                    type: object
      security:
        - BearerAuth: []
      summary: Create a product variant
      tags:
        - products
  "/products/images/{imageId}":
    delete:
      parameters:
        - description: Image id
          in: path
          name: imageId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
      security:
        - BearerAuth: []
      summary: Delete a product image
      tags:
        - products
  "/products/scan/{code}":
    get:
      description: "Primary mobile entry point: resolves a scanned code to a product,
        variant and per-warehouse stock in one call."
      parameters:
        - description: Barcode or SKU
          in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_product.ScanResult"
                    type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                  red.ErrorEnvelope"
      security:
        - BearerAuth: []
      summary: Scan a barcode
      tags:
        - products
  /purchase-orders:
    get:
      parameters:
        - description: Filter by status
          in: query
          name: filter[status]
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        items:
                          $ref: "#/components/schemas/internal_purchasing.PurchaseOrder"
                        type: array
                      meta:
                        $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                          red.PageMeta"
                    type: object
      security:
        - BearerAuth: []
      summary: List purchase orders
      tags:
        - purchase-orders
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_purchasing.POInput"
        description: Purchase order
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_purchasing.PurchaseOrder"
                    type: object
      security:
        - BearerAuth: []
      summary: Create a purchase order
      tags:
        - purchase-orders
  "/purchase-orders/{id}":
    get:
      parameters:
        - description: Purchase order id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_purchasing.PurchaseOrder"
                    type: object
      security:
        - BearerAuth: []
      summary: Get a purchase order
      tags:
        - purchase-orders
  "/purchase-orders/{id}/approve":
    post:
      parameters:
        - description: Purchase order id
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
                      red.Envelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/internal_purchasing.PurchaseOrder"
                    type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
