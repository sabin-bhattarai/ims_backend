servers:
  - url: /api/v1
components:
  requestBodies:
    internal_product.CategoryInput:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/internal_product.CategoryInput"
      description: Category
      required: true
    internal_purchasing.SupplierInput:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/internal_purchasing.SupplierInput"
      description: Supplier
      required: true
    internal_auth.refreshRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/internal_auth.refreshRequest"
      description: Refresh token (omit when using the cookie)
    internal_sales.CustomerInput:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/internal_sales.CustomerInput"
      description: Customer
      required: true
    internal_warehouse.Input:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/internal_warehouse.Input"
      description: Warehouse
      required: true
  securitySchemes:
    BearerAuth:
      description: Access token as "Bearer <token>". Obtain one from /auth/login and
        refresh it at /auth/refresh.
      in: header
      name: Authorization
      type: apiKey
  schemas:
    github_com_sabin-bhattarai_ims_backend_internal_shared.Code:
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - INSUFFICIENT_STOCK
        - INVALID_STATE_TRANSITION
      type: string
      x-enum-varnames:
        - CodeValidation
        - CodeUnauthorized
        - CodeForbidden
        - CodeNotFound
        - CodeConflict
        - CodeRateLimited
        - CodeInternal
        - CodeUnavailable
        - CodeInsufficientStock
        - CodeInvalidTransition
    github_com_sabin-bhattarai_ims_backend_internal_shared.Envelope:
      properties:
        data: {}
        meta: {}
      type: object
    github_com_sabin-bhattarai_ims_backend_internal_shared.Error:
      properties:
        code:
          $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
            red.Code"
        details:
          additionalProperties: {}
          type: object
        message:
          type: string
      type: object
    github_com_sabin-bhattarai_ims_backend_internal_shared.ErrorEnvelope:
      properties:
        error:
          $ref: "#/components/schemas/github_com_sabin-bhattarai_ims_backend_internal_sha\
            red.Error"
      type: object
    github_com_sabin-bhattarai_ims_backend_internal_shared.PageMeta:
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    internal_auth.ChangePasswordInput:
      properties:
        current_password:
          type: string
        new_password:
          maxLength: 128
          minLength: 10
          type: string
      required:
        - current_password
        - new_password
      type: object
    internal_auth.CreateUserInput:
      properties:
        email:
          maxLength: 255
          type: string
        full_name:
          maxLength: 120
          minLength: 2
          type: string
        password:
          maxLength: 128
          minLength: 10
          type: string
        phone:
          maxLength: 32
          type: string
        role:
          allOf:
            - $ref: "#/components/schemas/internal_auth.Role"
          enum:
            - admin
            - manager
            - warehouse_staff
            - viewer
      required:
        - email
        - full_name
        - password
        - role
      type: object
    internal_auth.LoginAudit:
      properties:
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        ip_address:
          type: string
        reason:
          type: string
        success:
          type: boolean
        user_agent:
          type: string
        user_id:
          type: string
      type: object
    internal_auth.LoginInput:
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    internal_auth.MeResponse:
      properties:
        permissions:
          items:
            $ref: "#/components/schemas/internal_auth.Permission"
          type: array
        user:
          $ref: "#/components/schemas/internal_auth.User"
      type: object
    internal_auth.Permission:
      enum:
        - user:manage
        - product:read
        - product:write
        - warehouse:read
        - warehouse:write
        - stock:read
        - stock:adjust
        - stock:transfer
        - stock:count
        - purchase:read
        - purchase:write
        - purchase:approve
        - sales:read
        - sales:write
        - sales:ship
        - return:approve
        - report:read
        - audit:read
      type: string
      x-enum-varnames:
        - PermUserManage
        - PermProductRead
        - PermProductWrite
        - PermWarehouseRead
        - PermWarehouseWrite
        - PermStockRead
        - PermStockAdjust
        - PermStockTransfer
        - PermStockCount
        - PermPurchaseRead
        - PermPurchaseWrite
        - PermPurchaseApprove
        - PermSalesRead
        - PermSalesWrite
        - PermSalesShip
        - PermReturnApprove
        - PermReportRead
        - PermAuditRead
    internal_auth.RegisterInput:
      properties:
        email:
          maxLength: 255
          type: string
        full_name:
          maxLength: 120
          minLength: 2
          type: string
        organization_name:
          maxLength: 120
          minLength: 2
          type: string
        password:
          maxLength: 128
          minLength: 10
          type: string
      required:
        - email
        - full_name
        - organization_name
        - password
      type: object
    internal_auth.ResetPasswordInput:
      properties:
        new_password:
          maxLength: 128
          minLength: 10
          type: string
        token:
          type: string
      required:
        - new_password
        - token
      type: object
    internal_auth.Role:
      enum:
        - admin
        - manager
        - warehouse_staff
        - viewer
      type: string
      x-enum-varnames:
        - RoleAdmin
        - RoleManager
        - RoleWarehouseStaff
        - RoleViewer
    internal_auth.SessionResponse:
      properties:
        permissions:
          items:
            $ref: "#/components/schemas/internal_auth.Permission"
          type: array
        tokens:
          $ref: "#/components/schemas/internal_auth.TokenPair"
        user:
          $ref: "#/components/schemas/internal_auth.User"
      type: object
    internal_auth.TokenPair:
      properties:
        access_token:
          type: string
        expires_at:
          type: string
        expires_in:
          example: 900
          type: integer
        refresh_token:
          type: string
        token_type:
          example: Bearer
          type: string
      type: object
    internal_auth.UpdateUserInput:
      properties:
        full_name:
          maxLength: 120
          minLength: 2
          type: string
        phone:
          maxLength: 32
          type: string
        role:
          allOf:
            - $ref: "#/components/schemas/internal_auth.Role"
          enum:
            - admin
            - manager
            - warehouse_staff
            - viewer
        status:
          allOf:
            - $ref: "#/components/schemas/internal_auth.UserStatus"
          enum:
